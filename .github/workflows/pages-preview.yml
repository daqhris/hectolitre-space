# Publishes the contents of www/ as a TEST site on GitHub Pages.
# The official site is still updated by FTP (FileZilla) from www/.
#
# Run it by hand: Actions > "Pages preview" > Run workflow.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# If a run fails (for example "Timeout reached" while GitHub syncs the files),
# start a NEW run with "Run workflow". Do not use "Re-run failed jobs": it
# uploads a second "github-pages" artifact and the deploy then fails with
# "Multiple artifacts named github-pages".
name: Pages preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned: "ubuntu-latest" moved to Ubuntu 26.04 on 2026-10-19, which is what
    # this workflow already runs on. Raise it by hand when a newer image is wanted.
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Copy www/ untouched, except server-only files that make no sense on
      # GitHub Pages (PHP cannot run there and would be shown as plain text).
      - name: Stage www/ without server-only files
        run: |
          mkdir _preview
          cp -a www/. _preview/
          rm -f _preview/sendcontact.php _preview/.htaccess
          touch _preview/.nojekyll

      - uses: actions/configure-pages@v6

      # include-hidden-files keeps .nojekyll in the artifact (since v4 the
      # action leaves out dotfiles unless asked).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _preview
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
